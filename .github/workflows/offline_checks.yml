name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/prepare_test_assets.py
      - run: python tools/build_ui_assets.py
      - run: python tools/verify_software.py
      - run: python -m unittest discover -s skill/pynq-portable-verification/tests -v
      - run: python tools/verify_receiver_sharing.py
      - run: python tools/verify_sharing_chain.py
