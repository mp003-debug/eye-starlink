[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynq-eye-tracker"
version = "0.1.0"
description = "PYNQ-Z2 standalone eye control foundation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.19", "Pillow>=8"]

[tool.setuptools.packages.find]
where = ["src"]
